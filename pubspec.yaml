name: toastification
description: Toastification is a Flutter package that allows you to easily show toast and notification messages in your application.
version: 3.2.0
homepage: https://payamzahedi.com/toastification/
repository: https://github.com/payam-zahedi/toastification
topics:
- toast
- notification
- message
- toastification

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^3.0.0
  uuid: ^4.6.0
  pausable_timer: ^3.1.0+3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  mockito: ^5.8.1
  build_runner: ^2.16.1


flutter:
  fonts:
   - family:  Toastification_icons
     fonts:
      - asset: assets/fonts/Toastification_icons.ttf
